<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Troca de Turno - MAHLE</title>
    
    <!-- Bibliotecas do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #eef2f5; margin: 0; padding: 10px; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .error { color: #d9534f; font-size: 14px; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .success { color: #5cb85c; font-size: 14px; margin-bottom: 10px; text-align: center; font-weight: bold; }
        
        h2 { margin-top: 0; color: #004b87; }
        .logo-text { font-size: 22pt; font-weight: bold; text-align: right; color: #000; letter-spacing: -1px; margin-bottom: 15px;}
        
        label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-top: 10px; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fdfdfd; }
        input:focus, textarea:focus { border-color: #004b87; outline: none; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        .btn-primary { background: #004b87; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; margin-top: 10px; }
        .btn-logout { background: #d9534f; color: #fff; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .section-title { background: #004b87; color: white; padding: 8px; text-align: center; font-size: 13px; font-weight: bold; border-radius: 4px; margin-top: 20px; margin-bottom: 10px; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="viewLogin" class="card">
        <div class="logo-text">MAHLE</div>
        <h2 class="text-center">Acesso ao Sistema</h2>
        <div id="loginMsg">Carregando banco de dados...</div>
        <label>Usuário</label>
        <input type="text" id="loginUser" placeholder="Digite seu usuário" autocapitalize="none">
        <label>Senha</label>
        <input type="password" id="loginPass" placeholder="Sua senha">
        <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- TELA DO FORMULÁRIO -->
    <div id="viewForm" class="card hidden">
        <div class="navbar">
            <span id="welcomeText" style="font-weight: bold; color: #004b87;"></span>
            <div style="display: flex; gap: 5px;">
                <button id="btnAdmin" class="btn-secondary hidden" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="toggleView('viewAdmin')">Admin</button>
                <button class="btn-logout" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="logout()">Sair</button>
            </div>
        </div>

        <div class="logo-text">MAHLE</div>
        <h2 class="text-center">Troca de Turno</h2>
        
        <div class="grid-2">
            <div><label>Data:</label><input type="date" id="f_data"></div>
            <div><label>Departamento:</label><input type="text" id="f_depto"></div>
            <div><label>Área de Produção:</label><input type="text" id="f_area"></div>
            <div><label>Para (Nome):</label><input type="text" id="f_para_nome"></div>
            <div><label>De (Nome):</label><input type="text" id="f_de_nome"></div>
            <div><label>Para (Turno):</label><input type="text" id="f_para_turno"></div>
            <div><label>De (Turno):</label><input type="text" id="f_de_turno"></div>
        </div>

        <div class="section-title">Situação da Produção</div>
        <div class="grid-2">
            <input type="text" placeholder="Linha 1" id="f_linha1">
            <input type="text" placeholder="Comentário" id="f_coment1">
            <input type="text" placeholder="Linha 2" id="f_linha2">
            <input type="text" placeholder="Comentário" id="f_coment2">
            <input type="text" placeholder="Linha 3" id="f_linha3">
            <input type="text" placeholder="Comentário" id="f_coment3">
        </div>

        <div class="section-title">Desvios de Processo</div>
        <textarea id="f_desvios" rows="3"></textarea>

        <div class="section-title">Paradas (Quebras / Falta de Material)</div>
        <textarea id="f_paradas" rows="3"></textarea>

        <div class="section-title">Questões Trabalhistas</div>
        <textarea id="f_trabalhistas" rows="3"></textarea>

        <div class="section-title">TPM / 5S</div>
        <textarea id="f_tpm" rows="3"></textarea>

        <div class="section-title">Geral</div>
        <textarea id="f_geral" rows="3"></textarea>

        <button class="btn-primary" onclick="enviarRelatorio()">Abrir E-mail com Relatório</button>
    </div>

    <!-- TELA ADMIN -->
    <div id="viewAdmin" class="card hidden">
        <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin-bottom: 20px; font-size: 12px; margin-top:0;" onclick="toggleView('viewForm')">← Voltar</button>
        <h2>Painel de Controle</h2>
        <div id="adminMsg"></div>
        <label>Nome do Novo Usuário</label>
        <input type="text" id="newUsername">
        <label>Senha Provisória</label>
        <input type="password" id="newPassword">
        <button class="btn-primary" onclick="criarUsuario()">Criar Acesso</button>
        <button class="btn-logout" onclick="limparBloqueios()">Destravar Contas Bloqueadas</button>
    </div>

    <script>
        // -------------------------------------------------------------
        // COLOQUE AQUI AS CREDENCIAIS DO SEU FIREBASE (PASSO 2 ABAIXO)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        
        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let dbPronto = false;

        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Verifica e cria o admin (Mizael) no servidor da nuvem, se não existir
        db.ref('users/Mizael').once('value', async (snapshot) => {
            if (!snapshot.exists()) {
                const adminHash = await hashPassword('37051064');
                await db.ref('users/Mizael').set({
                    username: 'Mizael',
                    password: adminHash,
                    role: 'admin'
                });
            }
            dbPronto = true;
            document.getElementById('loginMsg').innerText = "";
        });

        function toggleView(viewId) {
            document.getElementById('viewLogin').classList.add('hidden');
            document.getElementById('viewForm').classList.add('hidden');
            document.getElementById('viewAdmin').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        window.onload = () => {
            // Mantém a sessão ativa usando o aparelho do usuário atual
            const currentUser = localStorage.getItem('currentUser');
            const currentRole = localStorage.getItem('currentRole');
            
            if (currentUser) {
                document.getElementById('welcomeText').innerText = `Operador: ${currentUser}`;
                if (currentRole === 'admin') document.getElementById('btnAdmin').classList.remove('hidden');
                toggleView('viewForm');
            }
        };

        async function fazerLogin() {
            if (!dbPronto) return;
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');
            
            if (!user || !pass) {
                msg.innerText = "Preencha usuário e senha."; msg.className = "error"; return;
            }

            msg.innerText = "Autenticando..."; msg.className = "";

            // Consulta bloqueios na nuvem
            const attemptRef = db.ref('attempts/' + user);
            const attemptSnap = await attemptRef.once('value');
            let userAttempts = attemptSnap.exists() ? attemptSnap.val() : { count: 0, lockedUntil: 0 };

            if (Date.now() < userAttempts.lockedUntil) {
                const minutesLeft = Math.ceil((userAttempts.lockedUntil - Date.now()) / 60000);
                msg.innerText = `Conta bloqueada. Tente em ${minutesLeft} minutos.`; msg.className = "error"; return;
            }

            // Consulta usuário na nuvem
            const userSnap = await db.ref('users/' + user).once('value');
            
            if (userSnap.exists()) {
                const foundUser = userSnap.val();
                const hashedInput = await hashPassword(pass);
                
                if (foundUser.password === hashedInput) {
                    // Login Sucesso
                    await attemptRef.set({ count: 0, lockedUntil: 0 }); // Reseta bloqueios
                    localStorage.setItem('currentUser', foundUser.username);
                    localStorage.setItem('currentRole', foundUser.role);
                    window.location.reload();
                    return;
                }
            }

            // Login Falhou
            userAttempts.count += 1;
            if (userAttempts.count >= 8) {
                userAttempts.lockedUntil = Date.now() + (15 * 60 * 1000); 
                msg.innerText = "8 tentativas falhas. Conta bloqueada por 15 minutos.";
            } else {
                msg.innerText = `Usuário ou senha incorretos. Tentativa ${userAttempts.count} de 8.`;
            }
            await attemptRef.set(userAttempts);
            msg.className = "error";
        }

        async function criarUsuario() {
            const newUser = document.getElementById('newUsername').value.trim();
            const newPass = document.getElementById('newPassword').value;
            const msg = document.getElementById('adminMsg');

            if (newUser === '' || newPass === '') {
                msg.innerText = "Preencha todos os campos."; msg.className = "error"; return;
            }

            msg.innerText = "Criando..."; msg.className = "";

            const userSnap = await db.ref('users/' + newUser).once('value');
            if (userSnap.exists()) {
                msg.innerText = "Esse usuário já existe na base."; msg.className = "error"; return;
            }

            const hashedPass = await hashPassword(newPass);
            await db.ref('users/' + newUser).set({
                username: newUser,
                password: hashedPass,
                role: 'operator'
            });

            msg.innerText = `Usuário ${newUser} cadastrado com sucesso!`;
            msg.className = "success";
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
        }

        async function limparBloqueios() {
            await db.ref('attempts').remove();
            const msg = document.getElementById('adminMsg');
            msg.innerText = "Todos os bloqueios de todas as contas foram destravados.";
            msg.className = "success";
        }

        function enviarRelatorio() {
            const data = document.getElementById('f_data').value;
            const depto = document.getElementById('f_depto').value;
            const area = document.getElementById('f_area').value;
            const de_nome = document.getElementById('f_de_nome').value;
            const para_nome = document.getElementById('f_para_nome').value;
            const de_turno = document.getElementById('f_de_turno').value;
            const para_turno = document.getElementById('f_para_turno').value;
            
            const emailDestino = "supervisao@mahle.com"; 
            const assunto = `Relatório de Troca de Turno - ${data}`;
            
            const corpo = `
FORMULÁRIO DE TROCA DE TURNO - MAHLE
------------------------------------
Data: ${data} | Depto: ${depto}
Área de Produção: ${area}
De (Nome): ${de_nome} | De (Turno): ${de_turno}
Para (Nome): ${para_nome} | Para (Turno): ${para_turno}

1. SITUAÇÃO DA PRODUÇÃO
Linha: ${document.getElementById('f_linha1').value} | Comentário: ${document.getElementById('f_coment1').value}
Linha: ${document.getElementById('f_linha2').value} | Comentário: ${document.getElementById('f_coment2').value}
Linha: ${document.getElementById('f_linha3').value} | Comentário: ${document.getElementById('f_coment3').value}

2. DESVIOS DE PROCESSO
${document.getElementById('f_desvios').value}

3. PARADAS (Quebras / Falta de Material)
${document.getElementById('f_paradas').value}

4. QUESTÕES TRABALHISTAS
${document.getElementById('f_trabalhistas').value}

5. TPM / 5S
${document.getElementById('f_tpm').value}

6. GERAL
${document.getElementById('f_geral').value}

------------------------------------
Preenchido via Sistema Mobile por: ${localStorage.getItem('currentUser')}
            `;

            const link = `mailto:${emailDestino}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo.trim())}`;
            window.location.href = link;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            window.location.reload();
        }
    </script>
</body>
</html>
